x-env: &env
  NODE_ENV: production
  APP_URL: http://localhost:8080
  CLIENT_ORIGIN: http://localhost:8080
  MONGODB_URI: mongodb://mongo:27017/placecell
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${JWT_SECRET:-placecell-docker-dev-secret-not-for-prod}
  ADMIN_SIGNUP_CODE: ${ADMIN_SIGNUP_CODE:-placement_admin_2026}
  STORAGE_BACKEND: s3
  S3_BUCKET: placecell-resumes
  S3_REGION: us-east-1
  S3_ACCESS_KEY_ID: minio
  S3_SECRET_ACCESS_KEY: minio12345
  S3_ENDPOINT: http://minio:9000
  LLM_PROVIDER: ollama
  OLLAMA_BASE_URL: http://host.docker.internal:11434

x-feature: &feature
  build:
    context: .
    dockerfile: server/Dockerfile
  command: node dist/main.js
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    mongo:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully

services:
  mongo:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        i=0
        until mc alias set local http://minio:9000 minio minio12345; do
          i=$$((i+1))
          if [ "$$i" -gt 30 ]; then exit 1; fi
          sleep 2
        done
        mc mb --ignore-existing local/placecell-resumes

  identity:
    <<: *feature
    environment:
      <<: *env
      SERVICE: identity
      PORT: 5051
    expose:
      - "5051"

  catalog:
    <<: *feature
    environment:
      <<: *env
      SERVICE: catalog
      PORT: 5052
    expose:
      - "5052"

  applications:
    <<: *feature
    environment:
      <<: *env
      SERVICE: applications
      PORT: 5053
    expose:
      - "5053"

  matching:
    <<: *feature
    environment:
      <<: *env
      SERVICE: matching
      PORT: 5054
    expose:
      - "5054"

  interviews:
    <<: *feature
    environment:
      <<: *env
      SERVICE: interviews
      PORT: 5055
    expose:
      - "5055"

  notifications:
    <<: *feature
    environment:
      <<: *env
      SERVICE: notifications
      PORT: 5056
    expose:
      - "5056"

  analytics:
    <<: *feature
    environment:
      <<: *env
      SERVICE: analytics
      PORT: 5057
    expose:
      - "5057"

  gateway:
    <<: *feature
    command: node dist/gateway.js
    environment:
      <<: *env
      GATEWAY_PORT: 5050
      GATEWAY_USE_SERVICE_DNS: "1"
    expose:
      - "5050"
    depends_on:
      identity:
        condition: service_started
      catalog:
        condition: service_started
      applications:
        condition: service_started
      matching:
        condition: service_started
      interviews:
        condition: service_started
      notifications:
        condition: service_started
      analytics:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: node dist/worker.js
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - gateway
      - identity
      - catalog
      - applications
      - matching
      - interviews
      - notifications
      - analytics

  seed:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: server/Dockerfile
    command: node dist/seed.js
    environment:
      <<: *env
      NODE_ENV: development
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
  minio_data:
