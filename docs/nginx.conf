upstream identity { server identity:5051; }
upstream catalog { server catalog:5052; }
upstream applications { server applications:5053; }
upstream matching { server matching:5054; }
upstream interviews { server interviews:5055; }
upstream notifications { server notifications:5056; }
upstream analytics { server analytics:5057; }
upstream gateway { server gateway:5050; }

server {
  listen 80;
  client_max_body_size 12m;

  proxy_connect_timeout 2s;
  proxy_read_timeout 60s;
  proxy_set_header Host $host;
  proxy_set_header X-Request-Id $request_id;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location = /health {
    proxy_pass http://gateway/health;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
  }

  location = /ready {
    proxy_pass http://gateway/ready;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
  }

  location /v1/auth { proxy_pass http://identity; }
  location /v1/applications { proxy_pass http://applications; }
  location /v1/interviews { proxy_pass http://interviews; }
  location /v1/notifications { proxy_pass http://notifications; }
  location /v1/resumes { proxy_pass http://matching; }
  location /v1/fit { proxy_pass http://matching; }
  location /v1/ai { proxy_pass http://matching; }
  location /v1/admin/analytics { proxy_pass http://analytics; }
  location /v1/admin { proxy_pass http://catalog; }
  location /v1/jobs { proxy_pass http://catalog; }
  location /v1/profile { proxy_pass http://catalog; }

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
